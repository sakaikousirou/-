<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>カオスカードバトル</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; color: #ecf0f1; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .panel { background: #34495e; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { padding: 10px 15px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; font-weight: bold;}
        button:hover { background: #c0392b; }
        input, select { padding: 10px; margin: 5px; border-radius: 4px; border: none; }
        .hidden { display: none; }
        
        /* ログ & チャット */
        .log-box { height: 150px; overflow-y: scroll; background: #1a252f; padding: 10px; border-radius: 4px; font-family: monospace; margin-bottom: 10px; }
        .chat-box { height: 100px; overflow-y: scroll; background: #1a252f; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        
        /* カードデザイン */
        .card-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; justify-content: center; }
        .card { background: #ecf0f1; color: #2c3e50; padding: 10px; border-radius: 6px; width: 140px; cursor: pointer; border: 2px solid transparent; text-align: center; display: flex; flex-direction: column; align-items: center;}
        .card:hover { border: 2px solid #e74c3c; transform: translateY(-2px); transition: 0.2s;}
        .card.attack { border-top: 4px solid #e74c3c; }
        .card.defense { border-top: 4px solid #3498db; }
        .card.heal { border-top: 4px solid #2ecc71; }
        
        /* ステータスエリア */
        .status-area { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .player-status { background: #2c3e50; padding: 10px; border-radius: 6px; width: 48%; border: 1px solid #7f8c8d; }
        .player-box { display: flex; align-items: center; background: #1a252f; margin-bottom: 8px; padding: 8px; border-radius: 6px; border: 2px solid transparent; }
        .player-box.active-turn { border: 2px solid #f1c40f; box-shadow: 0 0 10px rgba(241,196,15,0.5); }
        .player-info { line-height: 1.4; }
        
        .timer { font-size: 24px; font-weight: bold; color: #e74c3c; text-align: center; margin-bottom: 10px;}
    </style>
</head>
<body>
<div class="container">
    <h1 style="text-align: center;">🔥 カオスカードバトル</h1>

    <!-- ログイン画面 -->
    <div id="login-panel" class="panel" style="text-align: center;">
        <h3>ルームに参加</h3>
        <input type="number" id="room-input" placeholder="ルーム番号 (例: 1)" value="1">
        <select id="mode-input">
            <option value="1v1">1 vs 1</option>
            <option value="2v2">2 vs 2</option>
        </select>
        <button onclick="joinRoom()">参加する</button>
        <p id="status-msg"></p>
    </div>

    <!-- キャラクター選択画面 -->
    <div id="char-select-panel" class="panel hidden">
        <h3 style="text-align: center;">キャラクターを選択してください</h3>
        <div id="char-list" class="card-container"></div>
    </div>

    <!-- バトル画面 -->
    <div id="battle-panel" class="panel hidden">
        <div class="timer">残り時間: <span id="timer-display">20</span>秒</div>
        
        <div class="status-area">
            <div id="teamA-status" class="player-status"><h4 style="margin-top:0; color:#e74c3c;">チーム A</h4></div>
            <div id="teamB-status" class="player-status"><h4 style="margin-top:0; color:#3498db;">チーム B</h4></div>
        </div>

        <div class="log-box" id="game-log"></div>

        <h3 style="text-align: center; margin-bottom: 5px;">手札 (クリックでプレイ)</h3>
        <div style="text-align: center;">
            <button onclick="passTurn()" style="background: #95a5a6; margin-bottom: 15px;">🍃 何もしない（パス / 防御放棄）</button>
        </div>
        <div id="hand-cards" class="card-container"></div>

        <hr style="border-color: #7f8c8d; margin: 30px 0 20px;">
        
        <h3>💬 チャット</h3>
        <div class="chat-box" id="chat-log"></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="chat-input" placeholder="メッセージを入力..." style="flex-grow: 1; color: black;">
            <button onclick="sendChat()">送信</button>
        </div>
    </div>
</div>

<!-- Socket.io -->
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myRoom = null;
    let myPlayerNumber = null;

    const ui = {
        login: document.getElementById('login-panel'),
        charSelect: document.getElementById('char-select-panel'),
        battle: document.getElementById('battle-panel'),
        statusMsg: document.getElementById('status-msg'),
        charList: document.getElementById('char-list'),
        gameLog: document.getElementById('game-log'),
        handCards: document.getElementById('hand-cards'),
        teamA: document.getElementById('teamA-status'),
        teamB: document.getElementById('teamB-status'),
        timerDisplay: document.getElementById('timer-display'),
        chatLog: document.getElementById('chat-log'),
        chatInput: document.getElementById('chat-input')
    };

    // ドット絵生成関数
    const getAvatarUrl = (seed) => `https://api.dicebear.com/9.x/pixel-art/svg?seed=${seed}`;

    function addLog(msg, element = ui.gameLog) {
        const div = document.createElement('div');
        div.textContent = msg;
        element.appendChild(div);
        element.scrollTop = element.scrollHeight;
    }

    function joinRoom() {
        const roomNum = document.getElementById('room-input').value;
        const mode = document.getElementById('mode-input').value;
        if (!roomNum) return alert('ルーム番号を入力してください');
        myRoom = `Room${roomNum}`;
        socket.emit('joinRoom', { roomNumber: roomNum, mode });
    }

    function selectCharacter(charKey) {
        socket.emit('selectCharacter', { room: myRoom, playerNumber: myPlayerNumber, charKey });
        ui.charSelect.innerHTML = '<h3 style="text-align:center;">他のプレイヤーを待っています...</h3>';
    }

    function playCard(cardInstanceId) {
        socket.emit('playCard', { room: myRoom, playerNumber: myPlayerNumber, cardInstanceId, targetPlayerNumber: null });
    }

    function passTurn() {
        socket.emit('passTurn', { room: myRoom, playerNumber: myPlayerNumber });
    }

    function sendChat() {
        const msg = ui.chatInput.value;
        if (!msg) return;
        socket.emit('sendChat', { room: myRoom, playerNumber: myPlayerNumber, message: msg });
        ui.chatInput.value = '';
    }

    ui.chatInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendChat();
    });

    socket.on('status', msg => ui.statusMsg.textContent = msg);
    socket.on('errorMsg', msg => alert('エラー: ' + msg));
    socket.on('playerInfo', data => myPlayerNumber = data.playerNumber);

    socket.on('selectCharacterPhase', data => {
        ui.login.classList.add('hidden');
        ui.charSelect.classList.remove('hidden');
        ui.charList.innerHTML = '';
        
        for (const [key, char] of Object.entries(data.characters)) {
            const card = document.createElement('div');
            card.className = 'card';
            // ドット絵アイコンを追加
            card.innerHTML = `
                <img src="${getAvatarUrl(key)}" width="48" height="48" style="image-rendering: pixelated; border-radius: 4px; background: #bdc3c7; margin-bottom: 5px;">
                <strong>${char.name}</strong>
                <div style="font-size: 14px; margin: 5px 0; font-weight: bold; color: #c0392b;">HP: ${char.hp} / MP: ${char.mp}</div>
                <small style="font-size: 11px;">${char.desc}</small>
            `;
            card.onclick = () => selectCharacter(key);
            ui.charList.appendChild(card);
        }
    });

    socket.on('gameStart', data => {
        ui.charSelect.classList.add('hidden');
        ui.battle.classList.remove('hidden');
        updateBoard(data);
        addLog("⚔️ バトルスタート！");
    });

    socket.on('gameStateUpdate', data => {
        if (data.log) addLog(data.log);
        updateBoard(data);
    });

    socket.on('timerUpdate', time => ui.timerDisplay.textContent = time);

    socket.on('receiveChat', data => {
        const prefix = data.isSelf ? "自分" : data.sender;
        addLog(`[${prefix}] ${data.message}`, ui.chatLog);
    });

    socket.on('gameOver', data => {
        alert(`ゲーム終了！ チーム${data.winnerTeam} の勝利です！`);
    });

    function updateBoard(data) {
        const players = data.players;
        const myData = players[myPlayerNumber];

        ui.teamA.innerHTML = '<h4 style="margin-top:0; color:#e74c3c;">チーム A</h4>';
        ui.teamB.innerHTML = '<h4 style="margin-top:0; color:#3498db;">チーム B</h4>';
        
        Object.keys(players).forEach(pNumStr => {
            const pNum = parseInt(pNumStr);
            const p = players[pNumStr];
            const isTurn = data.currentTurn === pNum;
            
            const pDiv = document.createElement('div');
            pDiv.className = `player-box ${isTurn ? 'active-turn' : ''}`;
            
            // バトル画面にもドット絵アイコンを追加
            pDiv.innerHTML = `
                <img src="${getAvatarUrl(p.charKey)}" width="40" height="40" style="image-rendering: pixelated; border-radius: 4px; background: #bdc3c7; margin-right: 10px; ${p.isDead ? 'filter: grayscale(100%); opacity: 0.5;' : ''}">
                <div class="player-info" style="${p.isDead ? 'opacity:0.5;' : ''}">
                    <strong style="${isTurn ? 'color:#f1c40f;' : ''}">${p.char} ${pNum === myPlayerNumber ? '(自分)' : ''}</strong> ${p.isDead ? '💀' : ''}<br>
                    <span style="color:#e74c3c;">HP: ${p.hp}</span> / <span style="color:#3498db;">MP: ${p.mp}</span>
                </div>
            `;
            
            if (p.team === 'A') ui.teamA.appendChild(pDiv);
            else ui.teamB.appendChild(pDiv);
        });

        ui.handCards.innerHTML = '';
        if (myData && !myData.isDead) {
            myData.hand.forEach(card => {
                const cDiv = document.createElement('div');
                cDiv.className = `card ${card.type}`;
                cDiv.innerHTML = `
                    <strong>${card.name}</strong>
                    <small style="margin: 4px 0; display:block; color:#7f8c8d;">${card.category}</small>
                    <div style="font-weight:bold;">威力: ${card.power}</div>
                    <div style="color:#3498db; font-weight:bold;">消費MP: ${card.mp}</div>
                `;
                cDiv.onclick = () => playCard(card.instanceId);
                ui.handCards.appendChild(cDiv);
            });
        }
    }
</script>
</body>
</html>
