<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>対戦型ゲーム</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
    }
    h1 { color: #ff9800; margin-bottom: 5px; }
    #status-msg { font-size: 1.2rem; color: #00e676; margin: 10px 0; }
    
    /* キャラ選択エリア */
    .char-select-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .char-card {
      background: #1e1e1e;
      border: 2px solid #ff9800;
      border-radius: 10px;
      padding: 15px;
      width: 160px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .char-card:hover {
      transform: scale(1.05);
      border-color: #00e676;
    }
    canvas.pixel-art {
      image-rendering: pixelated;
      background: #000;
      border-radius: 5px;
    }

    /* バトル画面 */
    #battle-screen { display: none; }
    .battle-field {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 15px 0;
      background: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
    }
    .player-box { width: 45%; }
    .hp-bar, .mp-bar {
      height: 12px;
      background: #444;
      border-radius: 6px;
      overflow: hidden;
      margin: 4px 0;
    }
    .hp-fill { height: 100%; background: #ff5252; width: 100%; transition: width 0.3s; }
    .mp-fill { height: 100%; background: #448aff; width: 100%; transition: width 0.3s; }

    /* 手札エリア */
    .hand-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    .card-item {
      background: #2a2a2a;
      border: 2px solid #555;
      border-radius: 8px;
      padding: 8px;
      width: 100px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .card-item:hover { border-color: #ff9800; transform: translateY(-4px); }
    .card-item.disabled { opacity: 0.4; cursor: not-allowed; }
    .card-cat { font-size: 0.7rem; color: #ffb74d; }
    .card-name { font-weight: bold; margin: 3px 0; }
    .card-cost { color: #448aff; font-weight: bold; }

    #log-box {
      background: #000;
      border: 1px solid #333;
      height: 80px;
      overflow-y: auto;
      padding: 8px;
      margin-top: 15px;
      font-size: 0.9rem;
      text-align: left;
    }
    button.pass-btn {
      background: #757575;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>対戦型ゲーム</h1>
  <div id="status-msg">対戦相手を待っています...</div>

  <div id="select-screen" style="display:none;">
    <h3>キャラクターを選択してください</h3>
    <div class="char-select-container" id="char-list"></div>
  </div>
<div id="center-attack-banner" class="attack-alert-banner" style="display: none;">
  <div class="alert-title">⚠️ 相手の攻撃予告！ ⚠️</div>
  <div class="alert-card-name" id="alert-card-name">―</div>
  <div class="alert-power-box">威力: <span id="alert-power-val">0</span></div>
  <p style="margin-top:8px; font-size:14px; color:#aaa;">防御カードを選択してガードしてください！</p>
</div>
  <div id="battle-screen">
    <div id="timer-display" style="font-size: 1.3rem; color: #ffeb3b;">残り時間: 20秒</div>

    <div class="battle-field">
      <div class="player-box" id="p1-box">
        <canvas id="p1-canvas" class="pixel-art" width="80" height="80"></canvas>
        <div id="p1-name" style="font-weight:bold;">---</div>
        <div>HP: <span id="p1-hp">--</span></div>
        <div class="hp-bar"><div id="p1-hp-fill" class="hp-fill"></div></div>
        <div>MP: <span id="p1-mp">--</span></div>
        <div class="mp-bar"><div id="p1-mp-fill" class="mp-fill"></div></div>
      </div>

      <div style="font-size: 1.5rem; font-weight: bold; color: #ff9800;">VS</div>

      <div class="player-box" id="p2-box">
        <canvas id="p2-canvas" class="pixel-art" width="80" height="80"></canvas>
        <div id="p2-name" style="font-weight:bold;">---</div>
        <div>HP: <span id="p2-hp">--</span></div>
        <div class="hp-bar"><div id="p2-hp-fill" class="hp-fill"></div></div>
        <div>MP: <span id="p2-mp">--</span></div>
        <div class="mp-bar"><div id="p2-mp-fill" class="mp-fill"></div></div>
      </div>
    </div>

    <h4>あなたの手札 (技を選ぶと攻撃)</h4>
    <div class="hand-container" id="hand-list"></div>
    <button class="pass-btn" onclick="passTurn()">パスする</button>

    <div id="log-box"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
