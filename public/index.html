<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>対戦型ゲーム</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #f39c12; margin-bottom: 10px; }
    .screen { display: none; }
    .active { display: block; }
    .char-card { border: 2px solid #555; padding: 15px; margin: 10px; display: inline-block; cursor: pointer; border-radius: 8px; background: #222; width: 200px; }
    .char-card:hover { border-color: #f39c12; background: #333; }
    .status-box { display: flex; justify-content: space-around; background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .hp-bar { background: #444; height: 20px; border-radius: 10px; overflow: hidden; margin-top: 5px; }
    .hp-fill { background: #2ecc71; height: 100%; width: 100%; transition: width 0.3s; }
    .hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
    .card { border: 1px solid #777; background: #2a2a2a; border-radius: 6px; padding: 10px; width: 120px; cursor: pointer; text-align: left; }
    .card:hover { border-color: #f1c40f; transform: translateY(-3px); }
    .card-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
    .card-type { font-size: 11px; color: #aaa; }
    .card-desc { font-size: 11px; margin-top: 5px; color: #ddd; }
    #log { background: #000; border: 1px solid #333; padding: 10px; height: 120px; overflow-y: auto; text-align: left; font-size: 13px; margin-top: 15px; border-radius: 5px; color: #00ffcc; }
    .waiting { font-size: 18px; color: #e74c3c; margin-top: 30px; }
  </style>
</head>
<body>

  <h1>対戦型ゲーム</h1>

  <!-- 待機画面 -->
  <div id="screen-wait" class="screen active">
    <p class="waiting" id="wait-msg">対戦相手を探しています...</p>
  </div>

  <!-- キャラ選択画面 -->
  <div id="screen-select" class="screen">
    <h2>キャラクターを選択してください</h2>
    <div id="char-list"></div>
    <p id="select-status" class="waiting" style="display:none;">相手のキャラ選択を待っています...</p>
  </div>

  <!-- 対戦画面 -->
  <div id="screen-battle" class="screen">
    <div class="status-box">
      <div>
        <h3 id="my-name">自分</h3>
        <div class="hp-bar"><div id="my-hp-fill" class="hp-fill"></div></div>
        <p id="my-hp-text">HP: 100/100</p>
        <p id="my-status" style="font-size:12px; color:#f39c12;"></p>
      </div>
      <div>
        <h3 id="turn-display" style="color:#f1c40f;">対戦開始</h3>
      </div>
      <div>
        <h3 id="enemy-name">相手</h3>
        <div class="hp-bar"><div id="enemy-hp-fill" class="hp-fill" style="background:#e74c3c;"></div></div>
        <p id="enemy-hp-text">HP: 100/100</p>
        <p id="enemy-status" style="font-size:12px; color:#f39c12;"></p>
      </div>
    </div>

    <div id="log">対戦開始！</div>

    <h3>あなたの手札</h3>
    <div id="hand" class="hand"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentRoom = null;
    let myPlayerNum = null;
    let myHand = [];
    let isMyTurn = false;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    socket.on("status", (msg) => {
      document.getElementById("wait-msg").innerText = msg;
    });

    socket.on("selectCharacterPhase", (data) => {
      currentRoom = data.room;
      myPlayerNum = data.playerNumber;
      showScreen("screen-select");

      const container = document.getElementById("char-list");
      container.style.display = "block";
      document.getElementById("select-status").style.display = "none";
      container.innerHTML = "";

      Object.keys(data.characters).forEach(key => {
        const c = data.characters[key];
        const div = document.createElement("div");
        div.className = "char-card";
        div.innerHTML = `<h3>${c.name}</h3><p>HP: ${c.hp}</p><p style="font-size:12px;">${c.desc}</p>`;
        div.onclick = () => {
          socket.emit("selectCharacter", { room: currentRoom, playerNumber: myPlayerNum, charKey: key });
          container.style.display = "none";
          document.getElementById("select-status").style.display = "block";
        };
        container.appendChild(div);
      });
    });

    socket.on("gameStart", (data) => {
      showScreen("screen-battle");
      updateState(data);
    });

    socket.on("gameStateUpdate", (data) => {
      if (data.log) {
        const logBox = document.getElementById("log");
        logBox.innerHTML += `<div>${data.log}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
      }

      if (data.winner) {
        if (data.winner === myPlayerNum) {
          alert("🎉 勝利しました！");
        } else {
          alert("💀 敗北しました...");
        }
        location.reload();
        return;
      }

      updateState(data);
    });

    function updateState(data) {
      const me = data.players[myPlayerNum];
      const enemy = data.players[myPlayerNum === 1 ? 2 : 1];

      document.getElementById("my-name").innerText = me.char || "自分";
      document.getElementById("my-hp-text").innerText = `HP: ${me.hp}/${me.maxHp}`;
      document.getElementById("my-hp-fill").style.width = `${(me.hp / me.maxHp) * 100}%`;
      document.getElementById("my-status").innerText = formatStatus(me.status);

      document.getElementById("enemy-name").innerText = enemy.char || "相手";
      document.getElementById("enemy-hp-text").innerText = `HP: ${enemy.hp}/${enemy.maxHp}`;
      document.getElementById("enemy-hp-fill").style.width = `${(enemy.hp / enemy.maxHp) * 100}%`;
      document.getElementById("enemy-status").innerText = formatStatus(enemy.status);

      isMyTurn = (data.turn === myPlayerNum);
      document.getElementById("turn-display").innerText = isMyTurn ? "あなたのターン" : "相手のターン...";

      if (me.hand) {
        myHand = me.hand;
        renderHand();
      }
    }

    function formatStatus(st) {
      if (!st) return "";
      let s = [];
      if (st.burn > 0) s.push(`🔥やけど(${st.burn}T)`);
      if (st.freeze > 0) s.push(`🧊こおり(${st.freeze}T)`);
      if (st.confused > 0) s.push(`🌀混乱(${st.confused}T)`);
      if (st.counter) s.push(`🛡️カウンター`);
      if (st.magicUp) s.push(`✨魔力2倍`);
      return s.join(" ");
    }

    function renderHand() {
      const container = document.getElementById("hand");
      container.innerHTML = "";
      myHand.forEach(card => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="card-title">${card.name}</div>
          <div class="card-type">[${card.category}]</div>
          <div class="card-desc">${card.desc}</div>
        `;
        div.onclick = () => {
          if (!isMyTurn) {
            alert("相手のターンです！");
            return;
          }
          socket.emit("playCard", { room: currentRoom, playerNumber: myPlayerNum, cardInstanceId: card.instanceId });
        };
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
