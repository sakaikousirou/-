<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>カオスカードバトル</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap');

        /* 全体背景（ゲーミングファンタジー風グラデーション＋パーティクル） */
        body {
            font-family: 'M PLUS Rounded 1c', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* 動きのある背景パーティクル */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(2px 2px at 20px 30px, #e74c3c, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #3498db, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 50px 160px, #f1c40f, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #2ecc71, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.35;
            z-index: -1;
            animation: stars 20s linear infinite;
        }

        @keyframes stars {
            from { background-position: 0 0; }
            to { background-position: 200px 400px; }
        }

        .container { max-width: 960px; margin: 0 auto; position: relative; }

        /* 豪華なネオンタイトル */
        .main-title {
            font-size: 42px;
            font-weight: 900;
            text-align: center;
            margin: 10px 0 25px 0;
            background: linear-gradient(135deg, #ff4e50 0%, #f9d423 50%, #e74c3c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            animation: title-glow 2s ease-in-out infinite alternate;
        }

        @keyframes title-glow {
            from { filter: drop-shadow(0 0 10px rgba(255, 78, 80, 0.6)); }
            to { filter: drop-shadow(0 0 25px rgba(249, 212, 35, 0.9)); }
        }

        /* パネルデザイン (ゲーミングガラスモフィズム) */
        .panel { 
            background: rgba(30, 41, 59, 0.85); 
            padding: 30px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px);
            border: 2px solid #3b82f6;
        }

        /* ログイン・参加パネル */
        .login-box {
            text-align: center;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 3px solid #ff4e50;
            box-shadow: 0 0 30px rgba(255, 78, 80, 0.3);
            max-width: 500px;
            margin: 0 auto;
        }

        .login-box h3 {
            font-size: 22px;
            color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
            margin-top: 10px;
        }

        .decor-pixel-banner {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .decor-pixel-banner img {
            width: 44px;
            height: 44px;
            image-rendering: pixelated;
            animation: float 2.5s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        input[type="number"], select {
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid #3b82f6;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            transition: all 0.2s;
        }

        input[type="number"]:focus, select:focus {
            border-color: #f1c40f;
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.6);
        }

        button { 
            padding: 12px 22px; 
            background: linear-gradient(135deg, #ff4e50, #f9d423); 
            color: #000; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 900;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(255, 78, 80, 0.4);
            transition: all 0.2s;
        }

        button:hover { 
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 6px 20px rgba(249, 212, 35, 0.7);
        }

        .hidden { display: none !important; }

        /* ログ & チャット */
        .log-box { height: 160px; overflow-y: scroll; background: #090a0f; padding: 12px; border-radius: 8px; font-family: monospace; margin-bottom: 15px; border: 1px solid #334155; color: #38bdf8; }
        .chat-box { height: 100px; overflow-y: scroll; background: #090a0f; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; }

        /* カードコンテナ */
        .card-container { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 15px; justify-content: center; }

        /* 基本カードデザイン */
        .card { 
            background: #ffffff; 
            color: #0f172a; 
            padding: 14px 12px; 
            border-radius: 12px; 
            width: 145px; 
            cursor: pointer; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            transition: all 0.25s ease;
            box-sizing: border-box;
            position: relative;
            user-select: none;
        }
        .card:hover { transform: translateY(-6px) scale(1.03); }

        /* --- 攻撃・防御・回復の強固な色分け & 発光演出 --- */
        /* 攻撃カード (赤) */
        .card.attack, .card[data-type="attack"] { 
            border: 3px solid #ef4444; 
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6); 
            background: linear-gradient(180deg, #ffffff 0%, #fee2e2 100%);
        }

        /* 防御カード (青) */
        .card.defense, .card[data-type="defense"] { 
            border: 3px solid #3b82f6; 
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.6); 
            background: linear-gradient(180deg, #ffffff 0%, #dbeafe 100%);
        }

        /* 回復カード (緑) */
        .card.heal, .card[data-type="heal"] { 
            border: 3px solid #10b981; 
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.6); 
            background: linear-gradient(180deg, #ffffff 0%, #d1fae5 100%);
        }

        /* ターン時強調パルス発光 (攻撃:赤 / 防御:青) */
        .card.turn-highlight-attack {
            animation: pulse-red 1.2s infinite ease-in-out;
        }
        .card.turn-highlight-defense {
            animation: pulse-blue 1.2s infinite ease-in-out;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(239, 68, 68, 1); transform: scale(1.05); }
            100% { box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); transform: scale(1); }
        }

        @keyframes pulse-blue {
            0% { box-shadow: 0 0 8px rgba(59, 130, 246, 0.6); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(59, 130, 246, 1); transform: scale(1.05); }
            100% { box-shadow: 0 0 8px rgba(59, 130, 246, 0.6); transform: scale(1); }
        }

        /* ステータスエリア */
        .status-area { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 15px; }
        .player-status { background: #0f172a; padding: 12px; border-radius: 10px; width: 48%; border: 1px solid #334155; }
        .player-box { display: flex; align-items: center; background: #1e293b; margin-bottom: 8px; padding: 10px; border-radius: 8px; border: 2px solid transparent; }
        .player-box.active-turn { border: 2px solid #f1c40f; box-shadow: 0 0 15px rgba(241,196,15,0.6); }
        .player-info { line-height: 1.4; }
        
        .timer { font-size: 26px; font-weight: 900; color: #ff4e50; text-align: center; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255, 78, 80, 0.5); }

        /* ポップアップ演出 (ダメージ) */
        #damage-popup {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 52px;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 15px #000, 3px 3px 0px #000;
            pointer-events: none;
            opacity: 0;
            z-index: 9999;
            transition: all 0.1s ease-out;
        }
        #damage-popup.show {
            animation: popup-anim 0.8s ease-out forwards;
        }

        @keyframes popup-anim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            30% { opacity: 1; transform: translate(-50%, -60%) scale(1.3); }
            70% { opacity: 1; transform: translate(-50%, -65%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(0.8); }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ダメージ表示用ポップアップ -->
    <div id="damage-popup"></div>

    <h1 class="main-title">🔥 カオスカードバトル</h1>

    <!-- ログイン画面 -->
    <div id="login-panel" class="panel login-box">
        <div class="decor-pixel-banner" id="login-decor">
            <!-- JavaScriptでドット絵プレビューアイコンを動的に生成挿入 -->
        </div>
        <h3>⚔️ ルームに参加する</h3>
        <div style="margin: 15px 0;">
            <input type="number" id="room-input" placeholder="ルーム番号" value="1">
            <select id="mode-input">
                <option value="1v1">1 vs 1</option>
                <option value="2v2">2 vs 2</option>
            </select>
        </div>
        <button onclick="joinRoom()">対戦開始！</button>
        <p id="status-msg" style="margin-top: 15px; color: #f1c40f; font-weight: bold;"></p>
    </div>

    <!-- キャラクター選択画面 -->
    <div id="char-select-panel" class="panel hidden">
        <h2 style="text-align: center; color: #f1c40f; margin-top: 0;">⚔️ キャラクターを選択</h2>
        <div id="char-list" class="card-container"></div>
    </div>

    <!-- バトル画面 -->
    <div id="battle-panel" class="panel hidden">
        <div class="timer">⏱️ 残り時間: <span id="timer-display">20</span>秒</div>
        
        <div class="status-area">
            <div id="teamA-status" class="player-status"><h4 style="margin-top:0; color:#ef4444;">チーム A</h4></div>
            <div id="teamB-status" class="player-status"><h4 style="margin-top:0; color:#3b82f6;">チーム B</h4></div>
        </div>

        <div class="log-box" id="game-log"></div>

        <h3 style="text-align: center; margin-bottom: 8px; color: #f1c40f;">🃏 あなたの手札</h3>
        <div style="text-align: center; margin-bottom: 15px;">
            <button onclick="passTurn()" style="background: #64748b; color: white;">🍃 何もしない（パス / 防御放棄）</button>
        </div>
        <div id="hand-cards" class="card-container"></div>

        <hr style="border-color: #334155; margin: 30px 0 20px;">
        
        <h3 style="color: #38bdf8;">💬 チャット</h3>
        <div class="chat-box" id="chat-log"></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="chat-input" placeholder="メッセージを入力..." style="flex-grow: 1;">
            <button onclick="sendChat()">送信</button>
        </div>
    </div>
</div>

<!-- Socket.io -->
<script src="/socket.io/socket.io.js"></script>
<script>
    // --- ドット絵データ & 描画 ---
    const PIXEL_DATA = {
      suzuki: ["...RRRR...","..RRRRRR..",".RROOOORR.",".OOOOOOOO.","..RRRRRR..",".RR.RR.RR.","..RRRRRR..","...RRRR...","...BBBB..."],
      wizard: ["...PPPP...","..PPPPPP..","..PPOOPP..",".OOOOOOOO.","..PPPPPP..",".YY.PP.YY.","..PPPPPP..","...PPPP...","...BBBB..."],
      rogue:  ["...GGGG...","..GGGGGG..","..GGOOGG..",".OOOOOOOO.","..GGGGGG..",".BB.GG.BB.","..GGGGGG..","...GGGG...","...BBBB..."],
      knight: ["...SSSS...","..SSSSSS..","..SSOOSS..",".OOOOOOOO.","..SSSSSS..",".CC.SS.CC.","..SSSSSS..","...SSSS...","...SSSS..."],
      ninja:  ["...BBBB...","..BBBBBB..","..BBOOBB..",".OOOOOOOO.","..BBBBBB..",".RR.BB.RR.","..BBBBBB..","...BBBB...","...BBBB..."],
      berserker:["...RRRR...","..RBBBRR..","..RROORR..",".OOOOOOOO.","..RRRRRR..",".BB.RR.BB.","..RRRRRR..","...RRRR...","...BBBB..."],
      paladin: ["...WWWW...","..WWWWWW..","..WWOOWW..",".OOOOOOOO.","..WWWWWW..",".YY.WW.YY.","..WWWWWW..","...WWWW...","...WWWW..."],
      necromancer:["...PPPP...","..PPBBPP..","..PBOOBP..",".OOOOOOOO.","..PPPPPP..",".GG.PP.GG.","..PPPPPP..","...PPPP...","...BBBB..."],
      archer: ["...GGGG...","..GGGGGG..","..GGOOGG..",".OOOOOOOO.","..GGGGGG..",".YY.GG.YY.","..GGGGGG..","...GGGG...","...DDDD..."],
      monk:   ["...YYYY...","..YYYYYY..","..YYOOYY..",".OOOOOOOO.","..YYYYYY..",".RR.YY.RR.","..YYYYYY..","...YYYY...","...BBBB..."]
    };

    const COLOR_MAP = {
      'R': '#e74c3c', 'O': '#f0a875', 'P': '#8e44ad', 'G': '#2ecc71',
      'S': '#bdc3c7', 'B': '#2c3e50', 'Y': '#f1c40f', 'C': '#1abc9c',
      'W': '#ffffff', 'D': '#7f8c8d'
    };

    function createPixelArtUrl(key) {
      const matrix = PIXEL_DATA[key];
      if (!matrix) return '';
      const canvas = document.createElement('canvas');
      const rows = matrix.length;
      const cols = matrix[0].length;
      const scale = 6;
      canvas.width = cols * scale;
      canvas.height = rows * scale;
      const ctx = canvas.getContext('2d');
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const char = matrix[r][c];
          if (char !== '.' && COLOR_MAP[char]) {
            ctx.fillStyle = COLOR_MAP[char];
            ctx.fillRect(c * scale, r * scale, scale, scale);
          }
        }
      }
      return canvas.toDataURL();
    }

    // ログイン画面にドット絵アイコンを装飾
    window.addEventListener('DOMContentLoaded', () => {
        const decor = document.getElementById('login-decor');
        ['suzuki', 'wizard', 'knight', 'ninja'].forEach(key => {
            const img = document.createElement('img');
            img.src = createPixelArtUrl(key);
            decor.appendChild(img);
        });
    });

    // --- 通信処理 ---
    const socket = io();
    let myRoom = null;
    let myPlayerNumber = null;

    const ui = {
        login: document.getElementById('login-panel'),
        charSelect: document.getElementById('char-select-panel'),
        battle: document.getElementById('battle-panel'),
        statusMsg: document.getElementById('status-msg'),
        charList: document.getElementById('char-list'),
        gameLog: document.getElementById('game-log'),
        handCards: document.getElementById('hand-cards'),
        teamA: document.getElementById('teamA-status'),
        teamB: document.getElementById('teamB-status'),
        timerDisplay: document.getElementById('timer-display'),
        chatLog: document.getElementById('chat-log'),
        chatInput: document.getElementById('chat-input'),
        damagePopup: document.getElementById('damage-popup')
    };

    function showDamagePopup(text) {
        ui.damagePopup.textContent = text;
        ui.damagePopup.classList.remove('show');
        void ui.damagePopup.offsetWidth; // リフロー発生
        ui.damagePopup.classList.add('show');
    }

    function addLog(msg, element = ui.gameLog) {
        const div = document.createElement('div');
        div.textContent = msg;
        element.appendChild(div);
        element.scrollTop = element.scrollHeight;

        // ダメージログ検知で画面中央にポップアップ表示
        const damageMatch = msg.match(/(\d+)\s*ダメージ/);
        if (damageMatch) {
            showDamagePopup(`${damageMatch[1]} DAMAGE!`);
        }
    }

    function joinRoom() {
        const roomNum = document.getElementById('room-input').value;
        const mode = document.getElementById('mode-input').value;
        if (!roomNum) return alert('ルーム番号を入力してください');
        myRoom = `Room${roomNum}`;
        socket.emit('joinRoom', { roomNumber: roomNum, mode });
    }

    function selectCharacter(charKey) {
        socket.emit('selectCharacter', { room: myRoom, playerNumber: myPlayerNumber, charKey });
        ui.charSelect.innerHTML = '<h3 style="text-align:center; color:#f1c40f;">対戦相手を待っています...</h3>';
    }

    function playCard(cardInstanceId) {
        socket.emit('playCard', { room: myRoom, playerNumber: myPlayerNumber, cardInstanceId, targetPlayerNumber: null });
    }

    function passTurn() {
        socket.emit('passTurn', { room: myRoom, playerNumber: myPlayerNumber });
    }

    function sendChat() {
        const msg = ui.chatInput.value;
        if (!msg) return;
        socket.emit('sendChat', { room: myRoom, playerNumber: myPlayerNumber, message: msg });
        ui.chatInput.value = '';
    }

    ui.chatInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendChat();
    });

    socket.on('status', msg => ui.statusMsg.textContent = msg);
    socket.on('errorMsg', msg => alert('エラー: ' + msg));
    socket.on('playerInfo', data => myPlayerNumber = data.playerNumber);

    socket.on('selectCharacterPhase', data => {
        ui.login.classList.add('hidden');
        ui.charSelect.classList.remove('hidden');
        ui.charList.innerHTML = '';
        
        for (const [key, char] of Object.entries(data.characters)) {
            const card = document.createElement('div');
            card.className = 'card';
            const imgUrl = createPixelArtUrl(key);
            card.innerHTML = `
                <img src="${imgUrl}" style="image-rendering: pixelated; margin-bottom: 6px; width:40px;">
                <strong style="color:#0f172a;">${char.name}</strong>
                <div style="font-size: 13px; margin: 4px 0; font-weight: bold; color: #ef4444;">HP: ${char.hp} / MP: ${char.mp}</div>
                <small style="font-size: 11px; color: #475569;">${char.desc}</small>
            `;
            card.onclick = () => selectCharacter(key);
            ui.charList.appendChild(card);
        }
    });

    socket.on('gameStart', data => {
        ui.charSelect.classList.add('hidden');
        ui.battle.classList.remove('hidden');
        updateBoard(data);
        addLog("⚔️ バトルスタート！");
    });

    socket.on('gameStateUpdate', data => {
        if (data.log) addLog(data.log);
        updateBoard(data);
    });

    socket.on('timerUpdate', time => ui.timerDisplay.textContent = time);

    socket.on('receiveChat', data => {
        const prefix = data.isSelf ? "自分" : data.sender;
        addLog(`[${prefix}] ${data.message}`, ui.chatLog);
    });

    socket.on('gameOver', data => {
        alert(`ゲーム終了！ チーム${data.winnerTeam} の勝利です！`);
    });

    function updateBoard(data) {
        const players = data.players;
        const myData = players[myPlayerNumber];
        const isMyTurn = data.currentTurn === myPlayerNumber;

        ui.teamA.innerHTML = '<h4 style="margin-top:0; color:#ef4444;">チーム A</h4>';
        ui.teamB.innerHTML = '<h4 style="margin-top:0; color:#3b82f6;">チーム B</h4>';
        
        Object.keys(players).forEach(pNumStr => {
            const pNum = parseInt(pNumStr);
            const p = players[pNumStr];
            const isTurn = data.currentTurn === pNum;
            const imgUrl = createPixelArtUrl(p.charKey);
            
            const pDiv = document.createElement('div');
            pDiv.className = `player-box ${isTurn ? 'active-turn' : ''}`;
            pDiv.innerHTML = `
                <img src="${imgUrl}" style="image-rendering: pixelated; margin-right: 12px; width:36px; ${p.isDead ? 'filter: grayscale(100%); opacity: 0.5;' : ''}">
                <div class="player-info" style="${p.isDead ? 'opacity:0.5;' : ''}">
                    <strong style="${isTurn ? 'color:#f1c40f;' : 'color:#fff;'}">${p.char} ${pNum === myPlayerNumber ? '(自分)' : ''}</strong> ${p.isDead ? '💀' : ''}<br>
                    <span style="color:#ef4444; font-weight:bold;">HP: ${p.hp}</span> / <span style="color:#3b82f6; font-weight:bold;">MP: ${p.mp}</span>
                </div>
            `;
            
            if (p.team === 'A') ui.teamA.appendChild(pDiv);
            else ui.teamB.appendChild(pDiv);
        });

        ui.handCards.innerHTML = '';
        if (myData && !myData.isDead) {
            myData.hand.forEach(card => {
                const cDiv = document.createElement('div');
                
                // カード種別の判定
                let cardType = card.type || 'attack';
                if (card.category && card.category.includes('防御')) cardType = 'defense';
                if (card.category && card.category.includes('攻撃')) cardType = 'attack';
                if (card.category && card.category.includes('回復')) cardType = 'heal';

                // 自分のターン時のハイライトクラス
                let highlightClass = '';
                if (isMyTurn) {
                    if (cardType === 'attack') highlightClass = 'turn-highlight-attack';
                    if (cardType === 'defense') highlightClass = 'turn-highlight-defense';
                }

                cDiv.className = `card ${cardType} ${highlightClass}`;
                cDiv.setAttribute('data-type', cardType);

                cDiv.innerHTML = `
                    <strong style="color:#0f172a; font-size:14px;">${card.name}</strong>
                    <small style="margin: 4px 0; display:block; color:#64748b; font-weight:bold;">${card.category}</small>
                    <div style="font-weight:900; color:#1e293b;">威力: ${card.power}</div>
                    <div style="color:#2563eb; font-weight:bold;">消費MP: ${card.mp}</div>
                `;
                cDiv.onclick = () => playCard(card.instanceId);
                ui.handCards.appendChild(cDiv);
            });
        }
    }
</script>
</body>
</html>
