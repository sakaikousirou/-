<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アルティメット・カードバトル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast-msg"></div>

  <div id="char-select-screen">
    <div class="title-logo">🔥 キャラクターセレクト 🔥</div>
    <div id="char-grid"></div>
  </div>

  <div id="game-screen" style="display: none;">
    <div class="header-bar">
      <div id="timer-display">🕒 残り時間: <span id="timer-val">20</span>秒</div>
    </div>

    <div class="battle-field">
      <div class="player-box" id="my-box">
        <canvas id="my-canvas" width="80" height="80"></canvas>
        <div class="badge player">【あなた】</div>
        <div class="char-name" id="my-name">-</div>
        <div class="stat-bar hp-bar">HP <span id="my-hp">0</span></div>
        <div class="stat-bar mp-bar">MP <span id="my-mp">0</span></div>
      </div>
      
      <div class="vs-text">VS</div>
      
      <div class="player-box" id="enemy-box">
        <canvas id="enemy-canvas" width="80" height="80"></canvas>
        <div class="badge enemy">【相手】</div>
        <div class="char-name" id="enemy-name">-</div>
        <div class="stat-bar hp-bar">HP <span id="enemy-hp">0</span></div>
        <div class="stat-bar mp-bar">MP <span id="enemy-mp">0</span></div>
      </div>
    </div>

    <div id="center-attack-banner" class="attack-alert-banner" style="display: none;">
      <div class="alert-title">⚠️ 相手の攻撃が来ます！ ⚠️</div>
      <div class="alert-card-name" id="alert-card-name">―</div>
      <div class="alert-power-box">威力: <span id="alert-power-val">0</span></div>
    </div>

    <div class="hand-section">
      <div class="turn-indicator" id="turn-guide-text">あなたの手札</div>
      <div id="hand-container"></div>
      <button id="pass-btn">⏭️ パスする</button>
    </div>

    <div class="bottom-area">
      <div class="panel log-panel">
        <div class="panel-title">📝 バトルログ</div>
        <div id="log-box"></div>
      </div>
      <div class="panel chat-panel">
        <div class="panel-title">💬 チャット</div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="煽りメッセージを入力...">
          <button id="chat-send">送信</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="main.js"></script>
</body>
</html>
