<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アルティメットカードバトル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 入室・モード選択画面 -->
  <div id="join-screen">
    <h1 style="font-size: 40px; color: #0984e3; text-shadow: 2px 2px 0px #fff;">アルティメットカードバトル</h1>
    <div style="background: rgba(255,255,255,0.8); display: inline-block; padding: 30px; border-radius: 16px; border: 3px solid #74b9ff;">
      <div style="font-size: 20px; font-weight: bold; margin-bottom: 20px;">
        <label>入るルームを選ぶ: </label>
        <select id="room-select" style="font-size: 18px; padding: 5px; border-radius: 8px;">
          <option value="1">ルーム 1</option>
          <option value="2">ルーム 2</option>
          <option value="3">ルーム 3</option>
          <option value="4">ルーム 4</option>
          <option value="5">ルーム 5</option>
          <option value="6">ルーム 6</option>
          <option value="7">ルーム 7</option>
          <option value="8">ルーム 8</option>
          <option value="9">ルーム 9</option>
        </select>
      </div>
      <div>
        <button id="btn-1v1" class="result-btn" style="margin-right:15px; background: linear-gradient(135deg, #74b9ff, #0984e3);">1 vs 1 (タイマン)</button>
        <button id="btn-2v2" class="result-btn" style="background: linear-gradient(135deg, #fdcb6e, #e17055);">2 vs 2 (チーム戦)</button>
      </div>
      <div id="status-msg" style="font-weight: bold; color: #d63031; margin-top: 20px; font-size: 18px;"></div>
    </div>
  </div>

  <!-- キャラクター選択画面 -->
  <div id="char-select-screen" style="display:none;">
    <h2>戦うキャラクターを選択してください</h2>
    <div id="char-grid"></div>
  </div>

  <!-- バトル画面 -->
  <div id="battle-screen" style="display:none;">
    <h2 id="timer-display">残り時間: 20秒</h2>
    
    <!-- プレイヤー配置エリア -->
    <div id="battle-field" class="battle-field"></div>

    <h3 id="turn-indicator" style="margin-top: 15px; font-size: 24px; color: #d63031;"></h3>
    
    <!-- 手札 -->
    <div id="hand-container"></div>
    <button id="pass-btn">何もしない (パス)</button>

    <!-- ログ＆チャット -->
    <div class="bottom-area">
      <div id="log-box"></div>
      <div id="chat-box">
        <div id="chat-messages"></div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="メッセージを入力...">
          <button id="chat-send">送信</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ターゲット選択モーダル (誰に使うか) -->
  <div id="target-modal" class="target-modal" style="display:none;">
    <h3 style="margin-top: 0;">誰に使いますか？</h3>
    <div id="target-list" class="target-list"></div>
    <button id="cancel-target" class="result-btn" style="background: #8395a7; margin-top:15px; width: 100%; font-size: 16px; padding: 10px;">やめる (キャンセル)</button>
  </div>

  <!-- トースト・結果表示 -->
  <div id="toast-msg"></div>
  <div id="result-overlay" class="result-overlay" style="display:none;">
    <div id="result-text" class="result-title"></div>
    <div style="color: white; margin-bottom: 20px; font-weight: bold; font-size: 20px;">※勝者はチャットで煽ることができます</div>
    <button class="result-btn" onclick="location.reload()">タイトルに戻る</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
